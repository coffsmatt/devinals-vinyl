<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Devinals • Vinyl Player</title><style>
:root{font-family:Georgia,serif;color:#f7e7c8;background:#161b1b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 10%,#35453f,#101616 75%)}main{width:min(100%,780px)}h1{text-align:center;letter-spacing:.12em;font-size:clamp(1.7rem,5vw,3rem);margin:0 0 6px}header p{text-align:center;color:#c7ae83;margin:0 0 24px}.deck{position:relative;padding:30px 25px 25px;border:12px solid #744729;border-radius:24px;background:linear-gradient(135deg,#c28b53,#8d552f 45%,#bc8247);box-shadow:0 25px 65px #0009,inset 0 0 0 3px #d5a46d}.top{display:flex;justify-content:center;position:relative;min-height:340px}.platter{width:min(75vw,340px);height:min(75vw,340px);border-radius:50%;background:#101010;box-shadow:0 0 0 9px #373737,0 8px 20px #0008;display:grid;place-items:center;position:relative;overflow:hidden}.record{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,#151515 0 3px,#252525 4px 5px,#101010 6px 8px);animation:spin 1.82s linear infinite;animation-play-state:paused}.record.playing{animation-play-state:running}.label{width:37%;height:37%;border-radius:50%;background:radial-gradient(circle,#f3cf85 0 5%,#9d3d2d 6% 65%,#7c2c25 66%);border:3px solid #e6b76e;display:grid;place-items:center;text-align:center;color:#ffdfaa;font-weight:bold;font-size:clamp(10px,2vw,17px);letter-spacing:.06em;padding:9px}.arm{position:absolute;z-index:2;right:0;top:3px;width:115px;height:205px;transform-origin:91px 20px;transform:rotate(-26deg);transition:transform .6s;pointer-events:none}.arm.engaged{transform:rotate(2deg)}.arm:before{content:"";position:absolute;right:11px;top:5px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle,#d6d1bd,#595e58);border:5px solid #777}.arm:after{content:"";position:absolute;right:29px;top:26px;width:10px;height:173px;background:linear-gradient(90deg,#777,#e5e0c9,#6d6d67);transform:rotate(23deg);transform-origin:top;border-radius:5px}.needle{position:absolute;bottom:0;left:4px;background:#252525;width:31px;height:20px;transform:rotate(23deg);z-index:3;border-radius:4px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}button{font:inherit;cursor:pointer;background:#262b27;color:#ffe5b8;border:1px solid #e2b778;border-radius:30px;padding:12px 18px;min-height:46px}button:hover{background:#434a3d}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.primary{background:#672f25;font-weight:bold}#status{text-align:center;min-height:25px;margin:16px 0 0;color:#362316;font-weight:bold}.library{margin-top:25px;background:#242d29;border:1px solid #6c715d;border-radius:15px;padding:22px}.library h2{margin:0 0 12px;font-size:1.2rem}.song{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;margin:8px 0;border-radius:8px}.song.active{background:#785137}.muted{color:#c5bca8;font:14px system-ui,sans-serif}.progress{display:flex;gap:12px;align-items:center;font:13px system-ui,sans-serif;margin-top:17px}input[type=range]{flex:1;accent-color:#d7a264}footer{text-align:center;margin-top:16px;font:13px system-ui,sans-serif;color:#bcb6a8}code{color:#f0cb8f} @keyframes spin{to{transform:rotate(360deg)}}@media(max-width:550px){.deck{padding:20px 10px;border-width:8px}.top{min-height:280px}.arm{right:-3px;transform:scale(.8) rotate(-26deg);transform-origin:91px 20px}.arm.engaged{transform:scale(.8) rotate(2deg)}}@media(prefers-reduced-motion:reduce){.record{animation-duration:12s}.arm{transition:none}}</style></head><body><main><header><h1>THE DEVINALS</h1><p>THE VINYL COLLECTION · 33⅓ RPM</p></header><section class="deck" aria-label="Record player"><div class="top"><div class="platter"><div class="record" id="record"><div class="label">THE<br>DEVINALS<br>★</div></div></div><div class="arm" id="arm"><div class="needle"></div></div></div><div class="controls"><button id="prev" aria-label="Previous track">◀◀</button><button class="primary" id="play" aria-label="Play">▶ Play</button><button id="next" aria-label="Next track">▶▶</button><button id="stop">■ Stop</button></div><div id="status" role="status">Choose a record to begin</div></section><section class="library"><h2>Record crate</h2><div id="songs"></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" aria-label="Seek playback" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div><div class="progress"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"></div><p class="muted">Only tracks listed in <code>tracks.json</code> can play. Upload your authorised audio to the <code>music</code> folder.</p></section><footer>Made for GitHub Pages · No account, ads or tracking</footer></main><audio id="audio" preload="metadata"></audio><script>
const audio=document.querySelector('#audio'),record=document.querySelector('#record'),arm=document.querySelector('#arm'),songs=document.querySelector('#songs'),status=document.querySelector('#status'),play=document.querySelector('#play'),seek=document.querySelector('#seek');let tracks=[],index=-1;
const format=s=>Number.isFinite(s)?`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`:'0:00';
function render(){songs.replaceChildren();if(!tracks.length){songs.textContent='No Devinals recordings added yet.';return}tracks.forEach((t,i)=>{const b=document.createElement('button');b.className='song'+(i===index?' active':'');const name=document.createElement('span');name.textContent=`${i+1}. ${t.title}`;const marker=document.createElement('span');marker.textContent=i===index?'♪':'▶';b.append(name,marker);b.onclick=()=>select(i,true);songs.append(b)})}
function visual(){let on=!audio.paused&&!audio.ended;record.classList.toggle('playing',on);arm.classList.toggle('engaged',on);play.textContent=on?'Ⅱ Pause':'▶ Play';play.setAttribute('aria-label',on?'Pause':'Play')}
function select(i,autoplay){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;audio.src=tracks[index].file;audio.load();status.textContent=tracks[index].title;render();if(autoplay)audio.play().catch(()=>{status.textContent='Playback unavailable. Check the audio file and press Play.'});visual()}
play.onclick=()=>{if(index<0){select(0,true);return}if(audio.paused)audio.play().catch(()=>status.textContent='Unable to play this audio file.');else audio.pause()};document.querySelector('#prev').onclick=()=>select(index<0?0:index-1,true);document.querySelector('#next').onclick=()=>select(index+1,true);document.querySelector('#stop').onclick=()=>{audio.pause();audio.currentTime=0;visual()};audio.onplay=visual;audio.onpause=visual;audio.onended=()=>{if(index+1<tracks.length)select(index+1,true);else{status.textContent='End of the record';visual()}};audio.ontimeupdate=()=>{document.querySelector('#elapsed').textContent=format(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*100:0};audio.onloadedmetadata=()=>document.querySelector('#duration').textContent=format(audio.duration);audio.onerror=()=>{status.textContent='Track file not found or unsupported.';visual()};seek.oninput=()=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(seek.value)/100};document.querySelector('#volume').oninput=e=>audio.volume=Number(e.target.value);audio.volume=.8;
fetch('./tracks.json').then(r=>{if(!r.ok)throw Error('Missing tracks.json');return r.json()}).then(data=>{tracks=data.filter(t=>typeof t.title==='string'&&typeof t.file==='string'&&/^music\/[\w .()\-]+\.(mp3|m4a|ogg|wav)$/i.test(t.file));render()}).catch(()=>{status.textContent='Could not load tracks.json. Use a web server or GitHub Pages.';render()});
</script></body></html>
